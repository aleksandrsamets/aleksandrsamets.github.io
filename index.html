<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleksandr Samets</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #ffffff;
      max-width: 750px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 400;
      text-align: center;
      margin-bottom: 60px;
      letter-spacing: -0.02em;
    }

    section {
      margin-bottom: 50px;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 20px;
      color: #333;
    }

    p {
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 12px;
      color: #4a4a4a;
    }

    a {
      color: #1a1a1a;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.7;
    }

    a img {
      vertical-align: middle;
    }

    .profile-image {
      display: block;
      width: 200px;
      height: 200px;
      object-fit: cover;
      border: 1px solid #e0e0e0;
      margin: 0 auto 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      body {
        padding: 40px 20px;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 40px;
      }

      .profile-image {
        width: 160px;
        height: 160px;
        margin-bottom: 30px;
      }

      section {
        margin-bottom: 40px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Aleksandr Samets</h1>
    <img src="IMG_0109.jpeg" alt="Aleksandr Samets" class="profile-image">
  </header>

  <main>
    <section>
      <h2>About</h2>
      <p>Middlebury College 2020</p>
      <p>Occasional Coder / Learner / Tennis Player</p>
      <p>Investor at MSIM Counterpoint Global (Summer 2018 - Present)</p>
    </section>

    <section>
      <h2>Connect</h2>
      <p>
        <a href="https://www.linkedin.com/in/aleksandr-samets-424890130/" aria-label="LinkedIn profile">
          <img src="linkedinlogo.png" alt="LinkedIn" height="20" width="20">
        </a>
      </p>
    </section>
  </main>
</body>
</html>
